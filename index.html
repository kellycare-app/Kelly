<style>
:root{
  --bg:#FFFDF8; --card:#FFFFFF; --ink:#26221D; --muted:#8B8378;
  --orange:#FF8A3D; --orange-deep:#E8712A; --orange-soft:#FFF1E6;
  --green:#2FA36B; --green-soft:#E6F6EE; --red:#E5484D; --red-soft:#FDEBEC;
  --line:#F0E9DE; --blue:#4A7CFF; --blue-soft:#EAF0FF;
  --r:22px; --r-s:14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;font-weight:900}
h1{font-size:30px;letter-spacing:-.5px}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;font-size:72px;text-align:center}
.splash small{font-size:20px;font-weight:900;color:var(--orange)}

#app{padding:14px 16px 0;max-width:560px;margin:0 auto}

/* ---- header con foto ---- */
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--orange-soft);display:flex;align-items:center;justify-content:center;font-size:42px;border:4px solid #fff;box-shadow:0 4px 14px rgba(255,138,61,.25);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:132px;height:132px;font-size:64px;margin:0 auto}
.hero h1{line-height:1.1}

/* ---- card ADESSO (l'unico elemento "forte") ---- */
.now{background:var(--orange);color:#fff;border-radius:var(--r);padding:18px 18px 16px;margin-bottom:18px;box-shadow:0 10px 24px rgba(255,138,61,.35)}
.now .lbl{font-size:14px;font-weight:700;opacity:.9}
.now .what{font-size:26px;font-weight:900;margin:4px 0 12px;line-height:1.15}
.now.done{background:var(--green);box-shadow:0 10px 24px rgba(47,163,107,.3)}
.now.late{background:var(--red);box-shadow:0 10px 24px rgba(229,72,77,.3)}
.now.walk{background:var(--blue);box-shadow:0 10px 24px rgba(74,124,255,.3)}
.now .btn{background:#fff;color:var(--ink)}
.timer{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}

/* ---- pulsanti ---- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;background:var(--orange);color:#fff;font-weight:900;font-size:17px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--orange-soft);color:var(--orange-deep)}
.btn.ghost{background:transparent;color:var(--muted);min-height:44px}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.blue{background:var(--blue)}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;width:auto;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}

/* ---- lista routine ---- */
.list{background:var(--card);border-radius:var(--r);padding:4px 0;box-shadow:0 2px 10px rgba(38,34,29,.05)}
.task{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{font-weight:900;font-variant-numeric:tabular-nums;color:var(--muted);width:52px;flex:none}
.task .n{flex:1;min-width:0}
.task .n b{font-size:18px}
.task .n .sub{font-size:13px;color:var(--muted)}
.task.done .n b{color:var(--muted);text-decoration:line-through}
.chip{flex:none;border-radius:999px;padding:8px 14px;font-weight:900;font-size:14px;min-width:88px;text-align:center}
.chip.todo{background:var(--orange-soft);color:var(--orange-deep)}
.chip.done{background:var(--green-soft);color:var(--green)}
.chip.late{background:var(--red-soft);color:var(--red)}
.undo{color:var(--muted);font-size:20px;padding:6px;flex:none}

/* ---- sezioni ---- */
.sec{margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border-radius:var(--r-s);padding:10px 6px;text-align:center;box-shadow:0 2px 10px rgba(38,34,29,.05)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.banner{background:var(--blue-soft);color:#2A4FB8;border-radius:var(--r-s);padding:12px 14px;font-weight:700;margin-bottom:12px}
.banner.warn{background:var(--red-soft);color:var(--red)}

/* ---- REGISTRA (fab) ---- */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + var(--safe-b));z-index:20;width:auto;padding:0 28px;min-height:56px;border-radius:999px;box-shadow:0 10px 26px rgba(255,138,61,.45);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 8px;text-align:center;font-weight:900;font-size:16px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.tile span{font-size:30px;line-height:1}
.tile:active{transform:scale(.96)}
.tile.on{border-color:var(--orange);background:var(--orange-soft)}
.tile.red{border-color:var(--red-soft);background:var(--red-soft);color:var(--red)}

/* ---- salute ---- */
.hcard{min-width:0;overflow-wrap:anywhere;background:var(--card);border-radius:var(--r-s);padding:12px 10px;box-shadow:0 2px 10px rgba(38,34,29,.05);text-align:left}
.hcard .e{font-size:28px}
.hcard b{display:block;margin-top:4px;font-size:15px}
.hcard .sub{font-size:13px;color:var(--muted)}
.hcard .sub.due{color:var(--red);font-weight:700}
.sos{width:100%;background:var(--red);color:#fff;border-radius:var(--r);padding:18px;font-size:20px;font-weight:900;box-shadow:0 10px 24px rgba(229,72,77,.3);margin:4px 0 18px}

/* ---- diario ---- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border-radius:999px;padding:8px 14px;background:var(--card);font-weight:800;border:2px solid var(--line);font-size:15px}
.filters button.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-deep)}
.day{margin:14px 0 6px;font-weight:900;color:var(--muted);font-size:14px}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--r-s);padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 10px rgba(38,34,29,.05)}
.ev .e{font-size:26px;flex:none;line-height:1.2}
.ev .b{flex:1;min-width:0}
.ev .b b{display:block}
.ev .b .sub{font-size:14px;color:var(--muted)}
.ev .tm{color:var(--muted);font-size:14px;font-weight:800;flex:none}
.ev .del{color:var(--muted);flex:none;padding:0 4px;font-size:18px}
.ev img{border-radius:10px;margin-top:8px;max-height:220px}

/* ---- calendario ---- */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-head button{font-size:26px;padding:4px 12px;font-weight:900}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:var(--r);padding:10px 8px;box-shadow:0 2px 10px rgba(38,34,29,.05)}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:800;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;position:relative;font-size:15px}
.cal .d.off{color:#CFC8BD}
.cal .d.today{background:var(--orange-soft);color:var(--orange-deep)}
.cal .d.sel{outline:3px solid var(--orange)}
.cal .d .dots{display:flex;gap:2px;height:6px;margin-top:2px}
.cal .d .dots i{width:6px;height:6px;border-radius:50%;background:var(--orange)}
.cal .d .dots i.v{background:var(--blue)}
.cal .d .dots i.m{background:var(--green)}

/* ---- profilo / form ---- */
.field{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field span:first-child{color:var(--muted);flex:none}
.field span:last-child{font-weight:800;text-align:right;overflow-wrap:anywhere}
label{display:block;font-weight:800;font-size:14px;color:var(--muted);margin:12px 0 0}
label input,label select,label textarea{display:block;width:100%;margin-top:5px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:17px;font-weight:700;color:var(--ink)}
label textarea{min-height:80px;resize:vertical}
label input:focus,label select:focus,label textarea:focus{outline:none;border-color:var(--orange)}
label.ck{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);margin-top:14px}
label.ck input{width:24px;height:24px;margin:0;accent-color:var(--orange)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.choices button{border-radius:999px;padding:10px 16px;background:var(--card);border:2px solid var(--line);font-weight:800}
.choices button.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-deep)}

/* ---- sheet ---- */
#overlay{position:fixed;inset:0;background:rgba(38,34,29,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#overlay[hidden]{display:none}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:14px 18px calc(24px + var(--safe-b));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
#sheet .handle{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
#sheet h2{margin-bottom:6px}
#sheet form .btn{margin-top:18px}
.close{position:absolute;right:18px;margin-top:-2px;font-size:22px;color:var(--muted);padding:6px 10px}

/* ---- nav ---- */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(8px + var(--safe-b));z-index:30}
#nav[hidden]{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:6px 0;border-radius:12px}
#nav button span{font-size:22px}
#nav button.on{color:var(--orange-deep);background:var(--orange-soft)}

/* ---- toast ---- */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:99;max-width:90%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#toast[hidden]{display:none}
#toast.err{background:var(--red)}

/* ---- login ---- */
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login .logo{font-size:72px}
.login h1{margin-bottom:4px}
.login form{text-align:left;margin-top:20px}
.setup{padding:30px 20px;max-width:520px;margin:0 auto}
.setup code{background:#fff;padding:2px 6px;border-radius:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-weight:700}
.empty span{font-size:44px;display:block;margin-bottom:6px}
.members{display:flex;gap:8px;flex-wrap:wrap}
.members span{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;border:2px solid var(--line)}
a{color:var(--orange-deep);font-weight:800}

</style>
</head>
<body>
<div id="app"><div class="splash">🐶<br><small>Kelly Care</small></div></div>
<nav id="nav" hidden>
  <button data-a="nav" data-v="today"><span>🏠</span>Oggi</button>
  <button data-a="nav" data-v="diary"><span>📖</span>Diario</button>
  <button data-a="nav" data-v="health"><span>❤️</span>Salute</button>
  <button data-a="nav" data-v="calendar"><span>📅</span>Calendario</button>
  <button data-a="nav" data-v="profile"><span>🐶</span>Kelly</button>
</nav>
<div id="overlay" hidden><div id="sheet" role="dialog"></div></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   Kelly Care 🐶 — app.js
   PWA privata per gestire Kelly in due. Supabase = login, dati,
   sincronizzazione in tempo reale, foto e documenti.
   ============================================================ */
'use strict';

/* ---------- configurazione ---------- */
// Le chiavi possono stare in config.js OPPURE essere incollate nella schermata
// di configurazione dell'app (salvate sul telefono). Nessun file da modificare.
const CFG = (() => {
  const f = window.KELLY_CONFIG || {};
  const okFile = f.SUPABASE_URL && !f.SUPABASE_URL.includes('INSERISCI') && f.SUPABASE_ANON_KEY && !f.SUPABASE_ANON_KEY.includes('INSERISCI');
  if (okFile) return f;

const pad = n => String(n).padStart(2, '0');

const fmtDate = d => { d = new Date(d); return valid(d) ? `${WDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}` : ''; };
const fmtDateFull = d => { d = new Date(d); return valid(d) ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : ''; };
const ymd = (d = new Date()) => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const localDT = (d = new Date()) => { d = new Date(d); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ---------- Supabase helpers ---------- */
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
const T = t => sb.from(t);
async function ins(table, row) {
  const base = { dog_id: S.dog.id, created_by: S.user.id };
  if (['meals', 'toilet_events', 'health_events', 'notes'].includes(table)) base.occurred_at = new Date().toISOString();
  return q(T(table).insert({ ...base, ...row }).select().single());
}
async function upload(file, folder) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${S.dog.id}/${folder}/${Date.now()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  return path;
}
const urlCache = {};
async function signed(path) {
  if (!path) return null;
  if (urlCache[path] && urlCache[path].exp > Date.now()) return urlCache[path].url;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600 * 6);
  if (error) return null;
  urlCache[path] = { url: data.signedUrl, exp: Date.now() + 3600 * 5 * 1000 };
  return data.signedUrl;
}

/* ---------- OGGI ---------- */
function taskState(t) {
  const c = S.comps.find(x => x.task_id === t.id);
  if (c) return { st: 'done', c };
  const [h, m] = t.time.split(':').map(Number), now = new Date();
  const late = now.getHours() * 60 + now.getMinutes() > h * 60 + m + 60;
  return { st: late ? 'late' : 'todo' };
}
function walkClock() {
  if (!S.activeWalk) return '';
  const s = Math.floor((Date.now() - new Date(S.activeWalk.started_at)) / 1000);
  return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
}
function dueBanners() {
  const out = [];
  const seen = new Set();
  S.meds.filter(m => m.active && isDue(m.next_due)).forEach(m => out.push(`💊 Oggi c'è ${m.name} di ${dogName()}.`));
  S.vaccs.filter(v => isDue(v.next_due)).forEach(v => out.push(`💉 Vaccino ${v.name}: ${dueLabel(v.next_due)}`));
  S.healthAll.forEach(h => {
    if (seen.has(h.category) || !HCATS[h.category]) return; seen.add(h.category);
    if (isDue(h.next_due)) out.push(`${HCATS[h.category].e} ${HCATS[h.category].n} di ${dogName()}: ${dueLabel(h.next_due)}`);
  });
  S.appts.filter(a => isToday(a.starts_at)).forEach(a => out.push(`📅 Oggi alle ${fmtTime(a.starts_at)}: ${a.title}`));
  return out;
}
function renderToday() {
  const tasks = S.tasks.filter(t => t.active).sort((a, b) => a.time.localeCompare(b.time));
  const states = tasks.map(t => ({ t, ...taskState(t) }));
  const next = states.find(s => s.st !== 'done');
  let now;
  if (S.activeWalk) {
    now = `<div class="now walk"><div class="lbl">Passeggiata in corso 🐾 con ${esc(who(S.activeWalk.created_by))}</div>
      <div class="timer" id="walktimer">${walkClock()}</div>
      <button class="btn" data-a="endWalk" style="margin-top:10px">Termina passeggiata</button></div>`;
  } else if (next) {
    now = `<div class="now ${next.st}"><div class="lbl">${next.st === 'late' ? '⚠ In ritardo · era per le ' + next.t.time : 'Adesso · ore ' + next.t.time}</div>

async function loadDiary() {

    q(T('health_events').select('*').eq('dog_id', d).gte('occurred_at', from)),
    q(T('notes').select('*').eq('dog_id', d).gte('occurred_at', from)),
    q(T('weight_history').select('*').eq('dog_id', d).gte('measured_at', from))
  ]);
  const ev = [];
  meals.forEach(m => ev.push({ id: m.id, tb: 'meals', f: 'meal', t: m.occurred_at, e: m.is_snack ? '🦴' : '🍽️', title: m.is_snack ? 'Snack' : 'Pappa', sub: [m.food, m.brand, m.eaten_qty != null ? `mangiato ${m.eaten_qty}${m.unit || 'g'}` + (m.planned_qty ? ` su ${m.planned_qty}` : '') : '', m.notes].filter(Boolean).join(' · '), by: m.created_by }));
  walks.forEach(w => ev.push({ id: w.id, tb: 'walks', f: 'walk', t: w.started_at, e: '🐾', dur: w.duration_min || (w.ended_at ? minsBetween(w.started_at, w.ended_at) : 0), title: w.ended_at ? `Passeggiata · ${w.duration_min || minsBetween(w.started_at, w.ended_at)} min` : 'Passeggiata in corso', sub: [w.pee ? 'pipì' : '', w.poo ? 'popò' : '', w.notes].filter(Boolean).join(' · '), by: w.created_by }));
  toilet.forEach(x => ev.push({ id: x.id, tb: 'toilet_events', f: 'toilet', t: x.occurred_at, e: x.kind === 'poo' ? '💩' : '💧', title: x.kind === 'poo' ? 'Popò' : 'Pipì', sub: [x.stool, x.notes].filter(Boolean).join(' · '), by: x.created_by }));
  health.forEach(h => ev.push({ id: h.id, tb: 'health_events', f: h.category === 'medication_given' ? 'med' : 'health', t: h.occurred_at, e: healthEmoji(h), title: h.title || (HCATS[h.category] ? HCATS[h.category].n : h.category), sub: healthSub(h), by: h.created_by, photo: h.attachment_path }));
  notes.forEach(n => ev.push({ id: n.id, tb: 'notes', f: 'note', t: n.occurred_at, e: n.photo_path ? '📷' : '📝', title: n.photo_path ? 'Foto' : 'Nota', sub: n.text || '', by: n.created_by, photo: n.photo_path }));
  weights.forEach(w => ev.push({ id: w.id, tb: 'weight_history', f: 'weight', t: w.measured_at, e: '⚖️', title: `Peso: ${w.weight_kg} kg`, sub: w.notes || '', by: w.created_by }));
  ev.sort((a, b) => new Date(b.t) - new Date(a.t));
  for (const e of ev) if (e.photo) e.photoUrl = await signed(e.photo);
  S.diary = ev;
}
function healthEmoji(h) {
  return { sick: '🚨', vomit: '🤮', water: '💧', medication_given: '💊' }[h.category] || (HCATS[h.category] ? HCATS[h.category].e : '❤️');
}
function healthSub(h) {
  const d = h.details || {};
  const parts = [];
  if (h.category === 'sick' && d.symptoms) parts.push(d.symptoms.split(',').map(s => (SYMPTOMS.find(x => x[0] === s) || [s, s])[1]).join(', '));
  if (d.episodes) parts.push(`${d.episodes} episodi`);
  if (d.amount) parts.push(d.amount);
  if (d.dose) parts.push(d.dose);
  if (d.last_meal) parts.push('ultimo pasto: ' + d.last_meal);
  if (d.water) parts.push('acqua: ' + d.water);
  if (d.behavior) parts.push(d.behavior);
  if (h.next_due) parts.push('prossimo: ' + fmtDateFull(h.next_due));
  if (h.notes) parts.push(h.notes);
  return parts.join(' · ');
}
function weekStats() {
  const from = Date.now() - 7 * 86400000;
  const last7 = S.diary.filter(e => new Date(e.t).getTime() >= from);
  const meals = last7.filter(e => e.f === 'meal').length;
  const walks = last7.filter(e => e.f === 'walk');
  const mins = walks.reduce((a, w) => a + (w.dur || 0), 0);
  const pee = last7.filter(e => e.f === 'toilet' && e.e === '💧').length;
  const poo = last7.filter(e => e.f === 'toilet' && e.e === '💩').length;
  const health = last7.filter(e => e.f === 'health').length;
  const w0 = S.weights[0], w1 = S.weights[1];
  let peso = w0 ? `${w0.weight_kg} kg` : '—';
  if (w0 && w1) {
    const d = (w0.weight_kg - w1.weight_kg).toFixed(1);
    peso += d > 0 ? ` ↑${d}` : d < 0 ? ` ↓${Math.abs(d)}` : ' =';

  return `<div class="sec"><h2>Ultimi 7 giorni</h2></div>

}

/* ---------- CALENDARIO ---------- */
function calItems() {
  const items = [];
  S.meds.filter(m => m.active && m.next_due).forEach(m => items.push({ d: m.next_due, e: '💊', t: m.name, c: 'm' }));
  S.vaccs.filter(v => v.next_due).forEach(v => items.push({ d: v.next_due, e: '💉', t: `Vaccino ${v.name}`, c: 'v' }));
  const seen = new Set();
  S.healthAll.forEach(h => { if (!HCATS[h.category] || seen.has(h.category)) return; seen.add(h.category); if (h.next_due) items.push({ d: h.next_due, e: HCATS[h.category].e, t: HCATS[h.category].n, c: '' }); });
  S.appts.forEach(a => items.push({ d: ymd(a.starts_at), e: a.category === 'vet' ? '🩺' : a.category === 'grooming' ? '✂️' : '📅', t: `${fmtTime(a.starts_at)} ${a.title}${a.location ? ' · ' + a.location : ''}`, c: 'v', id: a.id }));
  return items;
}
function renderCalendar() {
  const base = S.calMonth || dayStart(); S.calMonth = base;
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1), startDow = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const items = calItems(); const byDay = {}; items.forEach(i => { (byDay[i.d] = byDay[i.d] || []).push(i); });
  let cells = ['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < startDow; i++) cells += '<div class="d off"></div>';
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(m + 1)}-${pad(d)}`;
    const its = byDay[key] || [];
    cells += `<button class="d${key === ymd() ? ' today' : ''}${key === S.calSel ? ' sel' : ''}" data-a="calSel" data-d="${key}">${d}<div class="dots">${its.slice(0, 3).map(i => `<i class="${i.c}"></i>`).join('')}</div></button>`;
  }
  const sel = S.calSel || ymd();
  const selItems = byDay[sel] || [];
  const upcoming = items.filter(i => i.d >= ymd()).sort((a, b) => a.d.localeCompare(b.d)).slice(0, 8);
  return `<h1>Calendario 📅</h1>
    <div class="cal-head"><button data-a="calPrev">‹</button><h2>${MONTHS[m]} ${y}</h2><button data-a="calNext">›</button></div>
    <div class="cal">${cells}</div>
    <div class="sec"><h2>${sel === ymd() ? 'Oggi' : fmtDateFull(sel)}</h2><button class="btn ghost sm" data-a="addAppt" data-d="${sel}">＋ Appuntamento</button></div>
    ${selItems.map(i => `<div class="ev"><div class="e">${i.e}</div><div class="b"><b>${esc(i.t)}</b></div>${i.id ? `<button class="del" data-a="delRow" data-tb="appointments" data-id="${i.id}">🗑</button>` : ''}</div>`).join('') || '<div class="empty small">Niente in programma.</div>'}
    <div class="sec"><h2>Prossime scadenze</h2></div>
    ${upcoming.map(i => `<div class="ev"><div class="e">${i.e}</div><div class="b"><b>${esc(i.t)}</b><div class="sub">${fmtDateFull(i.d)} · ${dueLabel(i.d)}</div></div></div>`).join('') || '<div class="empty small">Nessuna scadenza. Aggiungile dalla sezione Salute.</div>'}`;
}

const A = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el.dataset, el); return; }
  const ch = e.target.closest('[data-choices] button');
  if (ch) {
    const box = ch.parentElement, multi = box.dataset.multi === '1';
    if (!multi) box.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    ch.classList.toggle('on');
    const val = [...box.querySelectorAll('button.on')].map(b => b.dataset.val).join(',');
    box.parentElement.querySelector(`input[name="${box.dataset.choices}"]`).value = val;
    if (box.dataset.autosubmit === '1') box.closest('form').requestSubmit();
    return;
  }
  if (e.target.id === 'overlay') closeSheet();
});
A.closeSheet = closeSheet;

A.logout = () => sb.auth.signOut();
A.resetCfg = () => { if (confirm('Rimuovere le chiavi salvate su questo telefono? (i dati di Kelly restano su Supabase)')) { localStorage.removeItem('kc_config'); sb.auth.signOut(); location.reload(); } };

/* --- routine --- */
async function completeTask(taskId) {
  await q(T('task_completions').upsert({ dog_id: S.dog.id, task_id: taskId, task_date: ymd(), completed_by: S.user.id, completed_at: new Date().toISOString() }, { onConflict: 'task_id,task_date' }));
}
async function autoCompleteKind(kind) {
  const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
  const cand = S.tasks.filter(t => t.active && t.kind === kind && !S.comps.find(c => c.task_id === t.id))
    .map(t => { const [h, m] = t.time.split(':').map(Number); return { t, diff: h * 60 + m - nowM }; })
    .filter(x => x.diff <= 150).sort((a, b) => Math.abs(a.diff) - Math.abs(b.diff))[0];
  if (cand) await completeTask(cand.t.id);
}
A.doTask = ({ id }) => run(async () => { await completeTask(id); await loadToday(); render(); }, 'Fatto ✓');
A.undoTask = ({ id }) => run(async () => { await q(T('task_completions').delete().eq('id', id)); await loadToday(); render(); }, 'Annullato');
A.editTasks = () => {
  const rows = S.tasks.sort((a, b) => a.time.localeCompare(b.time)).map(t => `<div class="task"><div class="t">${esc(t.time)}</div><div class="n"><b>${esc(t.emoji)} ${esc(t.title)}</b><div class="sub">${t.active ? 'attiva' : 'disattivata'}</div></div><button class="undo" data-a="editTask" data-id="${t.id}">✏️</button><button class="undo" data-a="delTask" data-id="${t.id}">🗑</button></div>`).join('');
  openSheet('Routine giornaliera', `<div class="list">${rows}</div><button class="btn sec" style="margin-top:14px" data-a="editTask">＋ Aggiungi attività</button>`);
};

    ${F.check('active', 'Attiva', t.active)}${F.submit()}</form>`,

A.healthCat = ({ k }) => {
  const c = HCATS[k];
  let list = '', addBtn = '';
  if (k === 'weight') {
    list = S.weights.map(w => `<div class="ev"><div class="e">⚖️</div><div class="b"><b>${w.weight_kg} kg</b><div class="sub">${fmtDateFull(w.measured_at)} · ${esc(who(w.created_by))}${w.notes ? ' · ' + esc(w.notes) : ''}</div></div><button class="del" data-a="delRow" data-tb="weight_history" data-id="${w.id}">🗑</button></div>`).join('');
    addBtn = `<button class="btn" data-a="logWeight">＋ Nuovo peso</button>`;
  } else if (k === 'vaccine') {
    list = S.vaccs.map(v => `<div class="ev"><div class="e">💉</div><div class="b"><b>${esc(v.name)}</b><div class="sub">fatto: ${v.given_on ? fmtDateFull(v.given_on) : '—'}${v.next_due ? ` · prossimo: ${fmtDateFull(v.next_due)} (${dueLabel(v.next_due)})` : ''}${v.notes ? ' · ' + esc(v.notes) : ''}</div>${v.attachment_path ? `<button class="btn sm sec" style="margin-top:8px" data-a="openDoc" data-p="${esc(v.attachment_path)}">📎 Allegato</button>` : ''}</div><button class="undo" data-a="editVacc" data-id="${v.id}">✏️</button><button class="del" data-a="delRow" data-tb="vaccinations" data-id="${v.id}">🗑</button></div>`).join('');
    addBtn = `<button class="btn" data-a="editVacc">＋ Nuovo vaccino</button>`;
  } else if (k === 'medication') {
    list = S.meds.map(m => `<div class="ev"><div class="e">${m.active ? '💊' : '⏸️'}</div><div class="b"><b>${esc(m.name)}${m.dose ? ' · ' + esc(m.dose) : ''}</b><div class="sub">${esc([m.schedule, m.last_given ? 'ultimo: ' + fmtDateFull(m.last_given) : '', m.next_due ? 'prossimo: ' + fmtDateFull(m.next_due) + ' (' + dueLabel(m.next_due) + ')' : '', m.notes].filter(Boolean).join(' · '))}</div></div><button class="undo" data-a="editMed" data-id="${m.id}">✏️</button><button class="del" data-a="delRow" data-tb="medications" data-id="${m.id}">🗑</button></div>`).join('');
    addBtn = `<div class="row"><button class="btn" data-a="editMed">＋ Nuovo farmaco</button><button class="btn sec" data-a="logMed">💊 Dato ora</button></div>`;
  } else {
    list = S.healthAll.filter(h => h.category === k).map(h => `<div class="ev"><div class="e">${c.e}</div><div class="b"><b>${esc(h.title || c.n)}</b><div class="sub">${fmtDateFull(h.occurred_at)}${h.next_due ? ` · prossimo: ${fmtDateFull(h.next_due)} (${dueLabel(h.next_due)})` : ''}${h.notes ? ' · ' + esc(h.notes) : ''} · ${esc(who(h.created_by))}</div>${h.attachment_path ? `<button class="btn sm sec" style="margin-top:8px" data-a="openDoc" data-p="${esc(h.attachment_path)}">📎 Allegato</button>` : ''}</div><button class="del" data-a="delRow" data-tb="health_events" data-id="${h.id}">🗑</button></div>`).join('');
    addBtn = `<button class="btn" data-a="addHealth" data-k="${k}">＋ Registra ${c.n.toLowerCase()}</button>`;
  }
  openSheet(`${c.e} ${c.n}`, `${addBtn}<div style="margin-top:14px">${list || '<div class="empty small">Nessun dato ancora.</div>'}</div>`);
};

A.addDoc = () => openSheet('📁 Carica documento', `<form>${F.text('title', 'Titolo', '', 'es. Libretto sanitario')}${F.select('category', 'Tipo', [['libretto', 'Libretto sanitario'], ['vaccini', 'Vaccini'], ['analisi', 'Analisi'], ['ricetta', 'Ricetta'], ['referto', 'Referto'], ['microchip', 'Microchip'], ['altro', 'Altro']])}
  ${F.file('file', 'File (PDF o immagine)', 'image/*,application/pdf')}${F.submit('Carica')}</form>`,
  async d => { const f = d.file; if (!f || !f.size) throw new Error('Scegli un file'); const p = await upload(f, 'documents'); await ins('documents', { title: d.title || f.name, category: d.category, storage_path: p, mime: f.type }); closeSheet(); await A.nav({ v: 'health' }); toast('Documento caricato 📁'); });
A.openDoc = async ({ p }) => { const u = await signed(p); if (u) window.open(u, '_blank'); else toast('File non trovato', true); };
A.delDoc = ({ id, p }) => { if (confirm('Eliminare il documento?')) run(async () => { await sb.storage.from(BUCKET).remove([p]); await q(T('documents').delete().eq('id', id)); await A.nav({ v: 'health' }); }, 'Eliminato'); };
A.addAppt = ({ d }) => openSheet('📅 Appuntamento', `<form>${F.text('title', 'Cosa', '', 'es. Visita veterinaria')}${F.select('category', 'Tipo', [['vet', '🩺 Veterinario'], ['grooming', '✂️ Toelettatura'], ['other', '📅 Altro']])}
  ${F.dt('starts_at', 'Quando', (d || ymd()) + 'T10:00')}${F.text('location', 'Dove')}${F.area('notes', 'Note')}${F.submit()}</form>`,
  async x => { await ins('appointments', { title: x.title, category: x.category, starts_at: new Date(x.starts_at).toISOString(), location: x.location || null, notes: x.notes || null }); closeSheet(); await refreshAll(); toast('Appuntamento salvato 📅'); });
A.delRow = ({ tb, id }) => { if (confirm('Eliminare?')) run(async () => { await q(T(tb).delete().eq('id', id)); closeSheet(); await refreshAll(); }, 'Eliminato'); };

/* --- profilo, foto, nome, promemoria --- */
A.dogPhoto = () => openSheet('📷 Foto di ' + esc(dogName()), `<form>${F.file('file', 'Scegli o scatta la foto')}${F.submit('Salva foto')}</form>`,
  async d => { const f = d.file; if (!f || !f.size) throw new Error('Scegli una foto'); const p = await upload(f, 'profile'); await q(T('dogs').update({ photo_path: p }).eq('id', S.dog.id)); delete urlCache[p]; closeSheet(); await refreshAll(); toast('Che bella! 🐶'); });
A.editDog = () => {
  const d = S.dog;
  openSheet('Profilo di ' + esc(d.name), `<form>${F.text('name', 'Nome', d.name)}${F.text('breed', 'Razza', d.breed || '')}
    <div class="pair">${F.select('sex', 'Sesso', [['F', 'Femmina'], ['M', 'Maschio']], d.sex || 'F')}${F.date('birth_date', 'Data di nascita', d.birth_date || '')}</div>
    <div class="pair">${F.num('weight_kg', 'Peso (kg)', d.weight_kg || '')}${F.text('microchip', 'Microchip', d.microchip || '')}</div>
    ${F.check('neutered', 'Sterilizzata', d.neutered)}${F.text('food', 'Alimentazione', d.food || '')}${F.text('allergies', 'Allergie / intolleranze', d.allergies || '')}${F.area('notes', 'Note', d.notes || '')}${F.submit()}</form>`,
    async x => {
      await q(T('dogs').update({ name: x.name || 'Kelly', breed: x.breed || null, sex: x.sex, birth_date: x.birth_date || null, weight_kg: x.weight_kg || null, microchip: x.microchip || null, neutered: x.neutered, food: x.food || null, allergies: x.allergies || null, notes: x.notes || null }).eq('id', S.dog.id));
      closeSheet(); await refreshAll(); toast('Profilo aggiornato');
    });
};
A.editMe = () => openSheet('Il tuo nome', `<form>${F.text('name', 'Nome', S.profile.display_name || '')}${F.submit()}</form>`,
  async d => { await q(T('profiles').update({ display_name: d.name }).eq('id', S.user.id)); closeSheet(); await refreshAll(); toast('Nome aggiornato'); });
A.editRem = ({ id }) => {
  const r = S.reminders.find(x => x.id === id) || { title: '', time: '08:00', days: [1, 2, 3, 4, 5, 6, 7], active: true, category: 'other' };
  openSheet('🔔 Promemoria', `<form>${F.hidden('id', id || '')}${F.text('title', 'Messaggio', r.title, `es. 🐶 È ora della pappa di ${dogName()}!`)}${F.time('time', 'Orario', r.time)}
    ${F.choices('days', 'Giorni', [['1', 'lun'], ['2', 'mar'], ['3', 'mer'], ['4', 'gio'], ['5', 'ven'], ['6', 'sab'], ['7', 'dom']], (r.days || []).join(','), true)}
    ${F.check('active', 'Attivo', r.active)}${F.submit()}${id ? `<button type="button" class="btn ghost" data-a="delRow" data-tb="reminders" data-id="${id}">Elimina</button>` : ''}</form>`,
    async d => {
      const row = { title: d.title, time: d.time, days: d.days ? d.days.split(',').map(Number) : [1, 2, 3, 4, 5, 6, 7], active: d.active };
      if (d.id) await q(T('reminders').update(row).eq('id', d.id)); else await ins('reminders', row);
      closeSheet(); await refreshAll(); toast('Promemoria salvato 🔔');
    });
};
A.toggleRem = ({ id, on }) => run(async () => { await q(T('reminders').update({ active: on !== '1' }).eq('id', id)); await refreshAll(); });
A.enableNotif = async () => {
  if (!('Notification' in window)) return toast('Notifiche non supportate qui', true);
  const p = await Notification.requestPermission();
  if (p === 'granted') { notify(`🐶 Notifiche attive per ${dogName()}!`); render(); } else toast('Permesso non concesso', true);
};

/* ============================================================
   NOTIFICHE / PROMEMORIA
   ============================================================ */
async function notify(text) {
  if (!('Notification' in window) || Notification.permission !== 'granted') { toast(text); return; }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg && reg.showNotification) await reg.showNotification('Kelly Care', { body: text, tag: 'kc-' + text });
    else new Notification('Kelly Care', { body: text, });
  } catch { toast(text); }
}
function checkReminders() {
  if (!S.dog) return;
  const now = new Date(), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`, dow = now.getDay() === 0 ? 7 : now.getDay();
  S.reminders.filter(r => r.active && r.time === hm && (!r.days || !r.days.length || r.days.includes(dow))).forEach(r => {
    const key = `kc_fired_${r.id}_${ymd()}`;
    if (localStorage.getItem(key)) return;
    localStorage.setItem(key, '1'); notify(r.title);
  });
  // scadenze di oggi (una volta al giorno all'apertura)
  const dkey = `kc_due_${ymd()}`;
  if (!localStorage.getItem(dkey)) { const b = dueBanners(); if (b.length) { localStorage.setItem(dkey, '1'); b.slice(0, 3).forEach(notify); } }
  // pulizia chiavi vecchie
  Object.keys(localStorage).filter(k => (k.startsWith('kc_fired_') || k.startsWith('kc_due_')) && !k.endsWith(ymd())).forEach(k => localStorage.removeItem(k));
}
